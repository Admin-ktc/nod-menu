<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOD Menu</title>
<meta name="theme-color" content="#4F1325">
<style>
  body{margin:0;background:#4F1325}
  main{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:6px 0 24px}
  img{display:block;width:100%;height:auto;background:#3d0f1d;aspect-ratio:1240/1754}
</style>
</head>
<body>
<main id="menu"></main>
<script>
/* =====================================================
   MENU PAGES — page badalni ho to us naam ki nayi image
   GitHub pe upload karo (same naam). Naya page jodna ho
   to neeche list mein uska naam add karo.
   ===================================================== */
const PAGES = [
  "page-01.jpg","page-02.jpg","page-03.jpg","page-04.jpg","page-05.jpg","page-06.jpg",
  "page-07.jpg","page-08.jpg","page-09.jpg","page-10.jpg","page-11.jpg","page-12.jpg"
];
const v = Date.now().toString().slice(0,-5); // purani image cache na rahe
const m = document.getElementById("menu");
PAGES.forEach((p,i)=>{
  const img = document.createElement("img");
  img.src = p + "?v=" + v;
  img.alt = "NOD menu page " + (i+1);
  if (i > 1) img.loading = "lazy";
  m.appendChild(img);
});
</script>
</body>
</html>
