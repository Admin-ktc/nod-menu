<style>
:root{--cream:#F4EDD8;--maroon:#4F1325;--pink:#E5194D;--ink:#2b1519;--muted:#6d5357;--line:#e2d7bd}
*{box-sizing:border-box}
html{scroll-padding-top:170px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--maroon);color:var(--cream)}
.top{max-width:720px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;letter-spacing:-1px;line-height:1}
.logo span{color:#FF6B8B}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--cream);background:transparent;color:var(--cream);border-radius:20px;padding:8px 16px;min-height:40px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--cream);color:var(--maroon)}
.tools{max-width:720px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px}
.tools input{flex:1;min-width:0;font:inherit;font-size:15px;border:0;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
.veg{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;padding:0 4px}
.veg input{width:20px;height:20px;accent-color:#1d7a3c}
nav{background:var(--cream);border-bottom:1px solid var(--line)}
.chips{position:relative;max-width:720px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--maroon);font-weight:700;font-size:13px;border:1.5px solid var(--maroon);border-radius:18px;padding:7px 13px}
.chips a.on{background:var(--maroon);color:var(--cream)}
main{max-width:720px;margin:0 auto;padding:8px 16px 40px}
section{padding-top:22px}
h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1.05;margin:0 0 4px;color:var(--pink);letter-spacing:-0.5px}
.note{font-size:13px;color:var(--muted);margin:0 0 6px}
.item{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.nm{font-weight:700;font-size:16px;line-height:1.3}
.ds{font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.pr{font-weight:700;font-size:16px;white-space:nowrap}
.sub .nm{font-weight:500;font-size:15px;padding-left:12px}
.v,.nv{display:inline-block;width:12px;height:12px;border:1.5px solid #1d7a3c;background:#fff;margin-left:6px;position:relative;vertical-align:-1px}
.nv{border-color:#c62828}
.v::after,.nv::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:#1d7a3c}
.nv::after{background:#c62828}
.tag{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 6px;border-radius:9px;margin-left:5px;vertical-align:2px;color:#fff;background:#1d7a3c}
.tag.vg{background:#3f7f22}.tag.eg{background:#b84f0e}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:700;color:var(--muted);margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 32px}
</style>
</head>

/* ============ MENU DATA KHATAM — neeche code mat chhedna ============ */

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
let tab="food";
const $=id=>document.getElementById(id);

function marks(t){
  let h="";
  if(t.includes("nv"))h+='<i class="nv" aria-label="Non veg"></i>';
  else if(/\bv\b/.test(t))h+='<i class="v" aria-label="Veg"></i>';
  if(/\beg\b/.test(t))h+='<span class="tag eg">EGG</span>';
  if(/\bgf\b/.test(t))h+='<span class="tag">GF</span>';
  if(/\bvg\b/.test(t))h+='<span class="tag vg">VEGAN</span>';
  return h;
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const vegOnly=$("vegOnly").checked;
  const cats=MENU[tab];
  let html="",chips="";
  cats.forEach(c=>{
    const items=c.items.filter(([n,p,d,t])=>{
      if(vegOnly&&(/\bnv\b/.test(t)||/\beg\b/.test(t)))return false;
      if(q&&!(n+" "+d).toLowerCase().includes(q))return false;
      return true;
    });
    if(!items.length)return;
    const id=slug(c.name);
    chips+=`<a href="#${id}">${esc(c.name)}</a>`;
    html+=`<section id="${id}"><h2>${esc(c.name)}</h2>${c.note?`<p class="note">${esc(c.note)}</p>`:""}`;
    items.forEach(([n,p,d,t])=>{
      html+=`<div class="item${/\bsub\b/.test(t)?" sub":""}"><div><div class="nm">${/\bsub\b/.test(t)?"• ":""}${esc(n)}${marks(t)}</div>${d?`<div class="ds">${esc(d)}</div>`:""}</div><div class="pr">${p!==""?"₹"+p:""}</div></div>`;
    });
    html+="</section>";
  });
  if(!html)html='<p class="empty">Kuch nahi mila — search badal ke dekhein.</p>';
  if(tab==="food")html+='<div class="legend"><span><i class="v"></i> Veg</span><span><i class="nv"></i> Non veg</span><span><span class="tag eg">EGG</span> Contains egg</span><span><span class="tag">GF</span> Gluten free</span><span><span class="tag vg">VEGAN</span> Vegan</span></div>';
  $("menu").innerHTML=html;
  $("chips").innerHTML=chips;
  $("vegOnly").parentElement.style.display=tab==="food"?"":"none";
  spy();
}

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"')q=true;
    else if(c==','){row.push(f);f="";}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n')i++; row.push(f);rows.push(row);row=[];f=""; }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
async function loadSheet(){
  if(!SHEET_URL)return;
  try{
    const r=await fetch(SHEET_URL+(SHEET_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const rows=parseCSV(await r.text());
    const h=rows.shift().map(x=>x.trim().toLowerCase());
    const col=k=>h.indexOf(k);
    const C={menu:col("menu"),cat:col("category"),note:col("category note"),name:col("item"),price:col("price"),desc:col("description"),type:col("type"),gf:col("gluten free"),vg:col("vegan"),sub:col("choice line"),av:col("available")};
    const get=(r,k)=>C[k]>=0&&r[C[k]]!==undefined?String(r[C[k]]).trim():"";
    const yes=v=>/^(yes|y|haan|1|true)$/i.test(v);
    const out={food:[],drinks:[]};let count=0;
    rows.forEach(r=>{
      const name=get(r,"name"); if(!name)return;
      if(/^(no|n|nahi|0|false)$/i.test(get(r,"av")))return;
      const tab=/drink/i.test(get(r,"menu"))?"drinks":"food";
      const catName=get(r,"cat")||"Menu";
      let cat=out[tab].find(c=>c.name===catName);
      if(!cat){cat={name:catName,items:[]};out[tab].push(cat);}
      if(!cat.note&&get(r,"note"))cat.note=get(r,"note");
      const ty=get(r,"type").toLowerCase();
      let tags=ty.startsWith("non")?"nv":ty.startsWith("egg")?"eg":ty.startsWith("veg")?"v":"";
      if(yes(get(r,"gf")))tags+=" gf"; if(yes(get(r,"vg")))tags+=" vg"; if(yes(get(r,"sub")))tags+=" sub";
      const pr=get(r,"price").replace(/[^0-9.]/g,"");
      cat.items.push([name,pr?Number(pr):"",get(r,"desc"),tags.trim()]);count++;
    });
    if(count){MENU=out;render();}
  }catch(e){ /* sheet nahi khuli — backup list hi dikhegi */ }
}
function spy(){
  const secs=[...document.querySelectorAll("section")];
  let cur=secs[0];
  secs.forEach(s=>{if(s.getBoundingClientRect().top<190)cur=s;});
  const bar=$("chips");
  bar.querySelectorAll("a").forEach(a=>{
    const on=cur&&a.getAttribute("href")==="#"+cur.id;
    if(on&&!a.classList.contains("on")){
      // sirf category bar ko side mein scroll karo, page ko nahi
      const left=a.offsetLeft-(bar.clientWidth-a.offsetWidth)/2;
      bar.scrollTo({left:Math.max(0,left),behavior:"smooth"});
    }
    a.classList.toggle("on",on);
  });
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  window.scrollTo(0,0);render();
}));
$("q").addEventListener("input",render);
$("vegOnly").addEventListener("change",render);
let t;window.addEventListener("scroll",()=>{clearTimeout(t);t=setTimeout(spy,60);},{passive:true});
render();
loadSheet();
</script>
